<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Tiles · Game Hall</title>
<meta name="theme-color" content="#1b1016">
<link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icons/icon-192.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/hall.css">
<style>
/* Word Tiles: maple letter tiles on a plum board with jewel-toned bonus squares; your rack sits on a walnut ledge. */
.wt{display:flex;flex-direction:column;align-items:center;gap:12px;--b:max(300px,min(var(--bs),calc(100dvh - 290px)))}
.frame{padding:8px;border-radius:16px;background:linear-gradient(150deg,var(--wood1),var(--wood2));box-shadow:var(--sh),inset 0 0 0 2px rgba(227,183,92,.4)}
.bd{position:relative;width:var(--b);aspect-ratio:1;display:grid;grid-template:repeat(15,1fr)/repeat(15,1fr);gap:2px;background:#2a1520;padding:2px;border-radius:6px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sq{position:relative;border-radius:3px;background:#4a2c3a;display:grid;place-items:center;font:800 clamp(6px,calc(var(--b)*.016),11px)/1 Manrope,system-ui,sans-serif;color:rgba(255,255,255,.88);text-align:center;cursor:pointer}
.sq.TW{background:#c2502a}.sq.DW{background:#c26a86}.sq.TL{background:#3a5cb8}.sq.DL{background:#5d9fb8}.sq.ST{background:#c26a86}
.sq.ST::before{content:"★";font-size:calc(var(--b)*.035);color:#fff}
.sq.drop{outline:2px solid #f3cf73;outline-offset:-2px}
.tile{position:absolute;inset:0;border-radius:3px;background:linear-gradient(160deg,#f7e6c4,#e4c893);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.4);display:grid;place-items:center;color:#3a2416;font:700 calc(var(--b)*.042)/1 Fraunces,Georgia,serif;text-transform:uppercase}
.tile small{position:absolute;right:7%;bottom:5%;font:800 calc(var(--b)*.017)/1 Manrope,system-ui,sans-serif}
.tile.blank{color:#8a4b2b}
.tile.last{box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 0 0 2px #f3cf73}
.tile.pend{background:linear-gradient(160deg,#fff3c8,#f3cf73);box-shadow:0 0 0 2px #fff,0 3px 8px rgba(0,0,0,.5);z-index:2;cursor:pointer}
.tile.bad{background:linear-gradient(160deg,#ffd2cf,#f08f88)}
.tile.ghost{opacity:.7;background:linear-gradient(160deg,#cfe8ff,#8fc0ee)}
.tile.new{animation:land .35s cubic-bezier(.2,.8,.3,1.2)}
@keyframes land{from{transform:scale(1.6);opacity:0}}
.ledge{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(100%,calc(var(--b) + 16px))}
.rack{display:flex;gap:6px;justify-content:center;padding:10px 12px 12px;border-radius:14px;background:linear-gradient(180deg,#6b3f22,#3a1d0e);box-shadow:0 8px 18px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.15);min-height:72px;width:100%}
.rk{--t:clamp(38px,calc(var(--b)*.1),56px);position:relative;width:var(--t);height:var(--t);border-radius:8px;background:linear-gradient(160deg,#f7e6c4,#e4c893);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 3px 6px rgba(0,0,0,.45);display:grid;place-items:center;color:#3a2416;font:700 calc(var(--t)*.56)/1 Fraunces,Georgia,serif;text-transform:uppercase;cursor:pointer;border:0;touch-action:none}
.rk small{position:absolute;right:8%;bottom:6%;font:800 calc(var(--t)*.22)/1 Manrope,system-ui,sans-serif}
.rk.sel{transform:translateY(-8px);box-shadow:0 0 0 3px #f3cf73,0 8px 12px rgba(0,0,0,.5)}
.rk.swap{box-shadow:0 0 0 3px #e5484d;transform:translateY(-6px)}
.rk.used{visibility:hidden}
.rk.drag{position:fixed;z-index:80;pointer-events:none;transform:scale(1.15)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ctl .ib{min-height:42px}
.pv{min-height:22px;font-size:14px;color:var(--mut);text-align:center;font-weight:700}
.pv .ok{color:var(--ok)}.pv .no{color:var(--danger)}
.bag{font:700 13px/1 Manrope,system-ui,sans-serif;color:var(--mut)}
.lp{position:fixed;inset:0;z-index:60;background:rgba(14,6,10,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.lp .box{background:var(--panel);border-radius:18px;padding:18px;max-width:420px;text-align:center;box-shadow:var(--sh)}
.lp .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.lp .grid button{aspect-ratio:1;border-radius:8px;border:0;background:linear-gradient(160deg,#f7e6c4,#e4c893);font:700 20px Fraunces,Georgia,serif;color:#3a2416;cursor:pointer;min-width:40px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12.5px;color:var(--mut);font-weight:700}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
</style>
</head>
<body>
<script src="../shared/peerjs.min.js"></script>
<script src="rules.js"></script>
<script src="../shared/hall.js"></script>
<script>
{
const {VAL, COUNT, PREM} = WT;
let DICT = null;
fetch('words.txt').then(r => r.text()).then(t => { DICT = new Set(t.split('\n')); if (HALL) HALL.refresh(); }).catch(() => {});
let HALL = null;
let engine = null, engineReady = false, reqId = 0; const waiting = {};
function getEngine(){
  if (engine) return engine;
  try{
    engine = new Worker('engine.js');
    engine.onmessage = e => { const m = e.data; if (m.t === 'ready') engineReady = true; if (m.t === 'moves' && waiting[m.id]){ waiting[m.id](m.moves); delete waiting[m.id]; } };
    engine.postMessage({t:'init', url:new URL('words.txt', location.href).href});
  }catch(e){ engine = null; }
  return engine;
}
function findMoves(board, rack){
  const w = getEngine(); if (!w) return Promise.resolve([]);
  return new Promise(res => { const id = ++reqId; waiting[id] = res; w.postMessage({t:'moves', id, board:board.map(x => x ? {l:x.l, v:x.v} : null), rack:rack.map(t => t.l)}); setTimeout(() => { if (waiting[id]){ delete waiting[id]; res([]); } }, 20000); });
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function setup({n, first}){
  const bag = []; let id = 0;
  for (const [l, k] of Object.entries(COUNT)) for (let i = 0; i < k; i++) bag.push({id:id++, l, v:l === '?' ? 0 : VAL[l]});
  shuffle(bag);
  const racks = []; for (let i = 0; i < n; i++) racks.push(bag.splice(0, 7));
  return {board:Array(225).fill(null), bag, racks, scores:Array(n).fill(0), turn:first % n, scoreless:0, n:0, last:null, done:false, end:null};
}
// Check a set of new tiles against the board; returns the words made and the score.
function evaluate(board, tiles){
  if (!tiles.length) return {err:'Place some tiles first'};
  const B = board.slice(); const empty = board.every(x => !x);
  for (const t of tiles){
    if (t.r < 0 || t.r > 14 || t.c < 0 || t.c > 14) return {err:'That’s off the board'};
    if (B[t.r * 15 + t.c]) return {err:'That square is taken'};
    B[t.r * 15 + t.c] = {l:t.l, v:t.b ? 0 : VAL[t.l], b:t.b, nw:true};
  }
  const rows = new Set(tiles.map(t => t.r)), cols = new Set(tiles.map(t => t.c));
  if (rows.size > 1 && cols.size > 1) return {err:'Tiles must be in one straight line'};
  const horiz = tiles.length === 1 ? null : rows.size === 1;
  const at = (r, c) => r < 0 || r > 14 || c < 0 || c > 14 ? null : B[r * 15 + c];
  const wordAt = (r, c, dr, dc) => {
    while (at(r - dr, c - dc)){ r -= dr; c -= dc; }
    const cells = []; while (at(r, c)){ cells.push([r, c]); r += dr; c += dc; }
    return cells;
  };
  // the main line must be gap-free
  const lineDir = horiz === null ? (at(tiles[0].r, tiles[0].c - 1) || at(tiles[0].r, tiles[0].c + 1) ? true : false) : horiz;
  const [dr, dc] = lineDir ? [0, 1] : [1, 0];
  const main = wordAt(tiles[0].r, tiles[0].c, dr, dc);
  if (!tiles.every(t => main.some(([r, c]) => r === t.r && c === t.c))) return {err:'Your tiles must form one word with no gaps'};
  if (empty){
    if (!tiles.some(t => t.r === 7 && t.c === 7)) return {err:'The first word must cover the star in the middle'};
    if (tiles.length < 2) return {err:'The first word needs at least two letters'};
  } else {
    const touches = tiles.some(t => [[0,1],[0,-1],[1,0],[-1,0]].some(([a, b]) => { const x = at(t.r + a, t.c + b); return x && !x.nw; })) || main.some(([r, c]) => !B[r * 15 + c].nw);
    if (!touches) return {err:'Your word must connect to the tiles already on the board'};
  }
  const groups = [];
  if (main.length >= 2) groups.push(main);
  for (const t of tiles){ const cr = wordAt(t.r, t.c, dc, dr); if (cr.length >= 2) groups.push(cr); }
  if (!groups.length) return {err:'Make a word of at least two letters'};
  const words = []; let total = 0;
  for (const g of groups){
    let base = 0, mult = 1, w = '';
    for (const [r, c] of g){ const x = B[r * 15 + c], p = x.nw ? PREM[r * 15 + c] : null; w += x.l; base += x.v * WT.lm(p); mult *= WT.wm(p); }
    words.push({w, pts:base * mult, ok:!DICT || DICT.has(w)}); total += base * mult;
  }
  if (tiles.length === 7) total += WT.BINGO;
  return {words, score:total, bingo:tiles.length === 7};
}
function endGame(s, finisher){
  const left = s.racks.map(r => r.reduce((a, t) => a + t.v, 0));
  s.racks.forEach((r, i) => { s.scores[i] -= left[i]; });
  if (finisher != null){ const sum = left.reduce((a, b) => a + b, 0); s.scores[finisher] += sum; }
  s.done = true; s.end = {finisher, left};
}
function act(s, seat, a){
  if (s.done) throw new Error('The game is over');
  if (seat !== s.turn) throw new Error('It’s not your turn');
  const rack = s.racks[seat], n = s.racks.length;
  if (a.pass){ s.scoreless++; s.n++; s.last = {seat, kind:'pass', n:s.n}; }
  else if (a.swap){
    const ids = Array.isArray(a.swap) ? a.swap : [];
    if (s.bag.length < 7) throw new Error('You can only swap while 7 or more tiles are left in the bag');
    const out = ids.map(id => rack.find(t => t.id === id)).filter(Boolean);
    if (!out.length) throw new Error('Pick the tiles to swap');
    out.forEach(t => rack.splice(rack.indexOf(t), 1));
    rack.push(...s.bag.splice(0, out.length)); s.bag.push(...out); shuffle(s.bag);
    s.scoreless++; s.n++; s.last = {seat, kind:'swap', count:out.length, n:s.n};
  }
  else if (Array.isArray(a.place)){
    if (!DICT) throw new Error('The dictionary is still loading. Try again in a moment.');
    const used = new Set(), tiles = [];
    for (const p of a.place.slice(0, 7)){
      const t = rack.find(x => x.id === p.id); if (!t || used.has(t.id)) throw new Error('Those tiles aren’t on your rack');
      used.add(t.id);
      const l = t.l === '?' ? String(p.as || '').toLowerCase() : t.l;
      if (!/^[a-z]$/.test(l)) throw new Error('Choose a letter for the blank tile');
      tiles.push({r:+p.r, c:+p.c, l, b:t.l === '?', id:t.id});
    }
    const ev = evaluate(s.board, tiles);
    if (ev.err) throw new Error(ev.err);
    const bad = ev.words.filter(w => !w.ok);
    if (bad.length) throw new Error((bad.length > 1 ? 'Not words: ' : 'Not a word: ') + bad.map(w => w.w.toUpperCase()).join(', '));
    for (const t of tiles){ s.board[t.r * 15 + t.c] = {l:t.l, v:t.b ? 0 : VAL[t.l], b:t.b}; rack.splice(rack.findIndex(x => x.id === t.id), 1); }
    rack.push(...s.bag.splice(0, 7 - rack.length));
    s.scores[seat] += ev.score; s.scoreless = 0; s.n++;
    s.last = {seat, kind:'play', words:ev.words.map(w => ({w:w.w, pts:w.pts})), pts:ev.score, bingo:ev.bingo, tiles:tiles.map(t => [t.r, t.c]), n:s.n};
    if (!rack.length && !s.bag.length){ endGame(s, seat); return s; }
  } else throw new Error('Play a word, swap tiles or pass');
  if (s.scoreless >= 2 * n + 2){ endGame(s, null); return s; }
  s.turn = (s.turn + 1) % n;
  return s;
}
async function cpu(s, seat, level){
  const rack = s.racks[seat];
  let moves = await findMoves(s.board, rack);
  moves = moves.filter(m => m.word.length <= [5, 8, 15, 15][level]);
  if (!moves.length){ if (s.bag.length >= 7){ const worst = rack.slice().sort((a, b) => b.v - a.v).slice(0, Math.min(4, rack.length)); return {swap:worst.map(t => t.id)}; } return {pass:true}; }
  let pick;
  if (level === 0) pick = moves[Math.floor(moves.length * (0.5 + Math.random() * 0.45))] || moves[moves.length - 1];
  else if (level === 1) pick = moves[Math.floor(moves.length * (0.15 + Math.random() * 0.3))] || moves[0];
  else if (level === 2) pick = moves[Math.floor(Math.random() * Math.min(3, moves.length))];
  else pick = moves[0];
  const pool = rack.slice();
  const place = pick.tiles.map(t => { const k = pool.findIndex(x => t.b ? x.l === '?' : x.l === t.l); const tile = pool.splice(k, 1)[0]; return {id:tile.id, r:t.r, c:t.c, as:t.b ? t.l : undefined}; });
  return {place};
}
let CTX = null, pend = [], sel = null, swapMode = false, swapSel = new Set(), lastN = null, ghost = null, order = null, rerender = () => {};
HALL = Hall.run({
  id:'wordtiles', name:'Word Tiles', min:2, max:4, defaultPlayers:2, colors:['#e3b75c', '#e5484d', '#2f72d6', '#2f9e5e'], hidden:true, handWord:'tiles',
  icon:'<svg viewBox="0 0 32 32"><rect x="3" y="7" width="13" height="13" rx="2.5" fill="#efd7a8" transform="rotate(-8 9 13)"/><rect x="15" y="11" width="13" height="13" rx="2.5" fill="#efd7a8" transform="rotate(7 21 17)"/><text x="9" y="17.5" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="10" fill="#3a2416" transform="rotate(-8 9 13)">W</text><text x="21.5" y="21" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="10" fill="#3a2416" transform="rotate(7 21 17)">T</text></svg>',
  tagline:'Build crossing words from your rack of seven letter tiles.',
  hintable:true, hintLabel:'Check my words and show a suggestion', hintShort:'Hints', logLabel:'Words',
  credit:'Word Tiles uses its own board and letter values. Word list: word-list by Sindre Sorhus (MIT), with common bad words removed.',
  rules:`<p>Everyone gets 7 letter tiles. Take turns placing tiles on the board to make words, like a crossword. Highest score at the end wins.</p>
  <h3>Placing a word</h3><ul><li>The first word must cover the ★ in the middle.</li><li>Put all your tiles for a turn in one row or one column, with no gaps, connected to tiles already on the board.</li><li>Every new word you make, across and down, has to be a real word.</li><li>Tap a tile on your rack, then a square (or drag it). Tap a placed tile to take it back. The blank tile can be any letter.</li></ul>
  <h3>Scoring</h3><ul><li>Each letter shows its points. <b>2L / 3L</b> double or triple that letter. <b>2W / 3W</b> (and the ★) double or triple the whole word.</li><li>Bonus squares only count on the turn you cover them.</li><li>Use all 7 tiles in one turn for <b>+50</b>.</li></ul>
  <h3>Other moves</h3><p>Instead of playing you can swap some tiles (while 7 or more are in the bag) or pass.</p>
  <h3>The end</h3><p>When the bag is empty and someone uses their last tile, the game ends: they gain everyone else's leftover tile points, and the others lose theirs. The game also ends if everyone passes or swaps twice in a row.</p>
  <h3>Hints</h3><p>With hints on, your word lights up green or red as you place it, you see its score before playing, and the Suggest button shows a good move. Everyone can see when your hints are on.</p>`,
  setup, act, cpu,
  current:s => s.done ? null : s.turn,
  view(s, seat){ s.racks = s.racks.map((r, i) => i === seat ? r : r.length); s.bag = s.bag.length; return s; },
  over(s){
    if (!s.done) return null;
    const mx = Math.max(...s.scores), w = s.scores.map((v, i) => v === mx ? i : -1).filter(i => i >= 0);
    return {winners:w, text:s.end && s.end.finisher != null ? 'after the last tile was played' : 'after everyone passed'};
  },
  cpuDelay:() => 900,
  describe(a, prev, next){
    const l = next.last;
    if (l.kind === 'pass') return 'passed';
    if (l.kind === 'swap') return `swapped ${l.count} tile${l.count > 1 ? 's' : ''}`;
    const [m, ...rest] = l.words;
    return `played ${m.w.toUpperCase()} for ${l.pts}` + (rest.length ? ` (also ${rest.map(x => x.w.toUpperCase()).join(', ')})` : '') + (l.bingo ? ' · all 7 tiles, +50!' : '');
  },
  score(s, i){ return {v:s.scores[i], l:'points'}; },
  status(s, {actor}){
    if (!s || s.done) return '';
    const bag = typeof s.bag === 'number' ? s.bag : s.bag.length;
    if (!DICT) return 'Loading the dictionary…';
    if (actor == null) return `${bag} tiles left in the bag`;
    return s.board.every(x => !x) ? 'Make the first word across the ★' : `Place tiles to make a word · ${bag} left in the bag`;
  },
  render
});
const esc = Hall.esc;
function myRack(){ const s = CTX.state; return CTX.actor != null ? s.racks[CTX.actor] : CTX.viewer != null && Array.isArray(s.racks[CTX.viewer]) ? s.racks[CTX.viewer] : []; }
function render(ctx, stage){
  CTX = ctx; rerender = () => render(CTX, stage);
  const s = ctx.state;
  let wt = stage.querySelector('.wt');
  if (!wt){
    stage.innerHTML = `<div class="wt"><div class="frame"><div class="bd"></div></div><div class="ledge"><div class="pv"></div><div class="rack"></div><div class="ctl"></div><div class="legend"><span><i style="background:#c2502a"></i>3× word</span><span><i style="background:#c26a86"></i>2× word</span><span><i style="background:#3a5cb8"></i>3× letter</span><span><i style="background:#5d9fb8"></i>2× letter</span></div></div></div>`;
    wt = stage.querySelector('.wt'); lastN = null;
    const bd = wt.querySelector('.bd');
    bd.innerHTML = Array.from({length:225}, (_, i) => { const p = PREM[i]; const lab = {TW:'3W', DW:'2W', TL:'3L', DL:'2L'}[p] || ''; return `<div class="sq ${p || ''}" data-i="${i}">${lab}</div>`; }).join('');
    bd.addEventListener('click', onBoard);
    wt.querySelector('.rack').addEventListener('pointerdown', onRackDown);
    wt.querySelector('.ctl').addEventListener('click', onCtl);
  }
  if (s.last && s.last.n !== lastN){ if (lastN !== null){ ctx.sfx[s.last.kind === 'play' ? 'place' : 'card'](); if (s.last.bingo) setTimeout(() => ctx.sfx.win(), 300); } pend = []; ghost = null; sel = null; swapMode = false; swapSel.clear(); order = null; }
  if (ctx.actor == null){ pend = []; sel = null; swapMode = false; }
  // board
  const lastSet = new Set((s.last && s.last.tiles || []).map(([r, c]) => r * 15 + c));
  const pendMap = new Map(pend.map(p => [p.r * 15 + p.c, p]));
  const ghostMap = new Map((ghost || []).map(t => [t.r * 15 + t.c, t]));
  const ev = pend.length ? evaluate(s.board, pend.map(p => ({r:p.r, c:p.c, l:p.l, b:p.b}))) : null;
  const badCells = new Set();
  wt.querySelectorAll('.sq').forEach(sq => {
    const i = +sq.dataset.i, x = s.board[i], p = pendMap.get(i), g = ghostMap.get(i);
    let t = sq.querySelector('.tile');
    const want = x ? 'b' + x.l + x.b : p ? 'p' + p.l + p.id : g ? 'g' + g.l : '';
    if ((t ? t.dataset.k : '') === want) { if (t) t.classList.toggle('last', !!x && lastSet.has(i)); return; }
    if (t) t.remove();
    if (!want) return;
    const L = x || p || g;
    t = document.createElement('div');
    t.className = 'tile' + (L.b ? ' blank' : '') + (x && lastSet.has(i) ? ' last' : '') + (p ? ' pend' : '') + (g ? ' ghost' : '') + (x && lastSet.has(i) && lastN !== null && s.last.n !== lastN ? ' new' : '');
    t.dataset.k = want;
    t.innerHTML = `${esc(L.l)}<small>${L.b ? '' : VAL[L.l]}</small>`;
    sq.appendChild(t);
  });
  // rack
  const rack = myRack();
  if (!order || order.length !== rack.length || !rack.every(t => order.includes(t.id))) order = rack.map(t => t.id);
  const used = new Set(pend.map(p => p.id));
  wt.querySelector('.rack').innerHTML = ctx.viewer == null && ctx.mode === 'local' ? '' : order.map(id => rack.find(t => t.id === id)).filter(Boolean).map(t => `<button class="rk ${used.has(t.id) ? 'used' : ''} ${sel === t.id ? 'sel' : ''} ${swapSel.has(t.id) ? 'swap' : ''}" data-id="${t.id}">${t.l === '?' ? '' : esc(t.l)}<small>${t.l === '?' ? '' : t.v}</small></button>`).join('');
  // preview line
  const pv = wt.querySelector('.pv');
  const bag = typeof s.bag === 'number' ? s.bag : s.bag.length;
  if (swapMode) pv.textContent = 'Tap the tiles you want to swap, then press Swap';
  else if (ev && ctx.hints){
    if (ev.err) pv.innerHTML = `<span class="no">${esc(ev.err)}</span>`;
    else pv.innerHTML = ev.words.map(w => `<span class="${w.ok ? 'ok' : 'no'}">${esc(w.w.toUpperCase())} ${w.pts}</span>`).join(' · ') + ` · <b>${ev.score} points</b>${ev.bingo ? ' (+50 bonus)' : ''}`;
  } else pv.innerHTML = ctx.actor != null ? `<span class="bag">${bag} tiles in the bag</span>` : '';
  // controls
  const c = [];
  if (ctx.actor != null){
    if (swapMode){ c.push(`<button class="ib pri" data-c="doswap" ${swapSel.size ? '' : 'disabled'}>Swap ${swapSel.size || ''}</button><button class="ib" data-c="cancel">Cancel</button>`); }
    else {
      c.push(`<button class="ib pri" data-c="play" ${pend.length ? '' : 'disabled'}>Play word${ev && !ev.err && ctx.hints ? ' · ' + ev.score : ''}</button>`);
      if (pend.length) c.push('<button class="ib" data-c="recall">Take back</button>');
      else c.push('<button class="ib" data-c="shuffle">Shuffle</button>');
      if (ctx.hints) c.push(`<button class="ib" data-c="suggest">Suggest</button>`);
      c.push(`<button class="ib" data-c="swap" ${bag >= 7 ? '' : 'disabled'}>Swap</button><button class="ib" data-c="pass">Pass</button>`);
    }
  }
  wt.querySelector('.ctl').innerHTML = c.join('');
  lastN = s.last ? s.last.n : 0;
}
function placeAt(i){
  const s = CTX.state; if (s.board[i] || pend.some(p => p.r * 15 + p.c === i)) return false;
  const t = myRack().find(x => x.id === sel); if (!t) return false;
  const put = l => { pend.push({id:t.id, r:Math.floor(i / 15), c:i % 15, l, b:t.l === '?'}); sel = null; ghost = null; CTX.sfx.place(); rerender(); };
  if (t.l === '?') pickLetter(put); else put(t.l);
  return true;
}
function onBoard(e){
  const ctx = CTX; if (!ctx || ctx.actor == null || swapMode) return;
  const sq = e.target.closest('.sq'); if (!sq) return;
  const i = +sq.dataset.i;
  const p = pend.findIndex(x => x.r * 15 + x.c === i);
  if (p >= 0){ pend.splice(p, 1); ctx.sfx.flip(); rerender(); return; }
  if (sel != null) placeAt(i);
  else if (!ctx.state.board[i]) ctx.toast('Pick a tile from your rack first');
}
function onCtl(e){
  const b = e.target.closest('[data-c]'); if (!b || !CTX) return;
  const k = b.dataset.c, ctx = CTX;
  if (k === 'play') ctx.act({place:pend.map(p => ({id:p.id, r:p.r, c:p.c, as:p.b ? p.l : undefined}))});
  else if (k === 'recall'){ pend = []; rerender(); }
  else if (k === 'shuffle'){ order = shuffle(order.slice()); ctx.sfx.card(); rerender(); }
  else if (k === 'swap'){ pend = []; swapMode = true; swapSel.clear(); rerender(); }
  else if (k === 'cancel'){ swapMode = false; swapSel.clear(); rerender(); }
  else if (k === 'doswap') ctx.act({swap:[...swapSel]});
  else if (k === 'pass'){ if (b.dataset.sure){ ctx.act({pass:true}); } else { b.dataset.sure = 1; b.textContent = 'Tap to pass'; setTimeout(() => { if (b.isConnected){ delete b.dataset.sure; b.textContent = 'Pass'; } }, 3000); } }
  else if (k === 'suggest'){
    b.disabled = true; b.textContent = 'Thinking…';
    findMoves(ctx.state.board, myRack()).then(ms => {
      if (!ms.length){ ctx.toast('No words found. Try swapping tiles.'); rerender(); return; }
      const m = ms[Math.floor(Math.random() * Math.min(3, ms.length))];
      const pool = myRack().slice();
      pend = m.tiles.map(t => { const k = pool.findIndex(x => t.b ? x.l === '?' : x.l === t.l); const tile = pool.splice(k, 1)[0]; return {id:tile.id, r:t.r, c:t.c, l:t.l, b:t.b}; });
      ctx.toast(`Try ${m.word.toUpperCase()} for ${m.score}`); rerender();
    });
  }
}
let dragT = null;
function onRackDown(e){
  const b = e.target.closest('.rk'); if (!b || !CTX || CTX.actor == null) return;
  const id = +b.dataset.id;
  if (swapMode){ swapSel.has(id) ? swapSel.delete(id) : swapSel.add(id); rerender(); return; }
  if (b.classList.contains('used')) return;
  const sx = e.clientX, sy = e.clientY; let ghostEl = null, moved = false;
  const move = ev => {
    if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
    moved = true;
    if (!ghostEl){ ghostEl = b.cloneNode(true); ghostEl.classList.add('drag'); ghostEl.style.width = b.offsetWidth + 'px'; ghostEl.style.height = b.offsetHeight + 'px'; document.body.appendChild(ghostEl); b.style.opacity = .3; }
    ghostEl.style.left = ev.clientX - b.offsetWidth / 2 + 'px'; ghostEl.style.top = ev.clientY - b.offsetHeight / 2 + 'px';
    document.querySelectorAll('.sq.drop').forEach(x => x.classList.remove('drop'));
    const under = document.elementFromPoint(ev.clientX, ev.clientY); const sq = under && under.closest('.sq'); if (sq) sq.classList.add('drop');
  };
  const up = ev => {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
    document.querySelectorAll('.sq.drop').forEach(x => x.classList.remove('drop'));
    if (ghostEl){ ghostEl.remove(); b.style.opacity = ''; }
    if (moved){ const under = document.elementFromPoint(ev.clientX, ev.clientY), sq = under && under.closest('.sq'); if (sq){ sel = id; placeAt(+sq.dataset.i); } return; }
    sel = sel === id ? null : id; CTX.sfx.flip(); rerender();
  };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
}
function pickLetter(cb){
  const d = document.createElement('div'); d.className = 'lp';
  d.innerHTML = `<div class="box"><h3 style="margin:0;font:700 24px Fraunces,Georgia,serif">Which letter is the blank?</h3><div class="grid">${'abcdefghijklmnopqrstuvwxyz'.split('').map(l => `<button data-l="${l}">${l.toUpperCase()}</button>`).join('')}</div></div>`;
  d.onclick = e => { const b = e.target.closest('[data-l]'); if (b){ d.remove(); cb(b.dataset.l); } else if (e.target === d){ d.remove(); sel = null; rerender(); } };
  document.body.appendChild(d);
}
}
</script>
