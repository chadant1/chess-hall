<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Hall</title>
<meta name="theme-color" content="#1b1016">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Game Hall">
<meta name="description" content="Chess, checkers, mancala, reversi and more. Play the computer, pass and play, or play family online with no accounts.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
// Old Chess Hall invite links pointed here; send them to the chess room.
if (/^#g-[a-z0-9]{4,12}$/.test(location.hash)) location.replace('chess/' + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/hall.css">
<style>
/* VOICE: a warm family games cupboard, opened on a club-room table.
   IDEA: the games shelf: each game a boxed set with its own lid art.
   PICTURE: the grid of game boxes is the page; each lid is a small hand-drawn SVG scene.
   COLOUR and TYPE: the plum leather and brass of Chess Hall; each lid brings its own game colours. Fraunces + Manrope.
   LAYOUT: a short welcome with name and join-by-code, then the shelf; one column on phones. */
.hero{padding:clamp(10px,3vw,30px) max(4vw,16px) 6px;max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,420px);gap:24px;align-items:end}
.hero h1{font:700 clamp(38px,6vw,64px)/1 Fraunces,Georgia,serif;margin:0;letter-spacing:-.02em}
.hero p{color:var(--mut);margin:10px 0 0;font-size:17px;max-width:56ch}
.quickbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh);display:grid;gap:10px}
.quickbox label{font-weight:800;font-size:14px}
.shelf{max-width:1240px;margin:0 auto;padding:22px max(4vw,16px) 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.box{position:relative;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s,border-color .2s}
a.box:hover{transform:translateY(-3px);border-color:var(--brass)}
.lid{aspect-ratio:16/10;display:block;width:100%}
.lid svg{width:100%;height:100%;display:block}
.bx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.bx h2{margin:0;font:700 24px/1.1 Fraunces,Georgia,serif}
.bx p{margin:0;color:var(--mut);font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tags span{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--panel2);color:var(--mut)}
.badge2{position:absolute;top:12px;right:12px;font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--brass);color:light-dark(#fff,#21120a);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.box.soon{opacity:.62;filter:saturate(.6)}
.box.soon .badge2{background:var(--panel2);color:var(--mut)}
.foot{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px) 40px;color:var(--mut);font-size:14px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="hero">
  <div><h1>Game Hall</h1><p>Pick a game. Play the computer, pass one device around, or send a link so family can play from their own phone or tablet. No accounts needed.</p></div>
  <div class="quickbox">
    <label for="nm">Your name</label><input id="nm" class="txt" maxlength="24" placeholder="Shown to other players online" autocomplete="nickname">
    <label for="jc">Got a game code?</label>
    <form class="row2" id="jf"><input id="jc" maxlength="8" placeholder="Code" autocomplete="off"><button class="ib pri" style="min-height:48px">Join</button></form>
  </div>
</header>
<main class="shelf" id="shelf"></main>
<p class="foot">Game Hall runs in your browser. Online games connect your devices directly; the person who creates a game keeps it open while you play.</p>
<div id="toast" role="status" aria-live="polite"></div>
<script src="shared/peerjs.min.js"></script>
<script>
{
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get = (k, d) => { try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } };
const set = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const wood = '<defs><linearGradient id="wd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b4a2a"/><stop offset="1" stop-color="#3a1d0e"/></linearGradient><radialGradient id="felt" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#3b2030"/><stop offset="1" stop-color="#1b1016"/></radialGradient></defs><rect width="320" height="200" fill="url(#felt)"/>';
const disc = (x, y, r, a, b) => `<ellipse cx="${x}" cy="${y + r * .25}" rx="${r}" ry="${r * .55}" fill="${b}"/><ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * .55}" fill="${a}"/><ellipse cx="${x}" cy="${y}" rx="${r * .62}" ry="${r * .33}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"/>`;
const ART = {
  chess:() => { const k = (typeof PIECE_SVG !== 'undefined') ? PIECE_SVG : null; let sq = ''; for (let r = 0; r < 4; r++) for (let c = 0; c < 8; c++) sq += `<rect x="${c * 40}" y="${110 + r * 30}" width="40" height="30" fill="${(r + c) % 2 ? '#a46f48' : '#ecd4ad'}"/>`;
    const pc = (key, x, y, s) => k ? `<image href="data:image/svg+xml;charset=utf-8,${encodeURIComponent(k[key].replace('<svg ', '<svg viewBox="0 0 45 45" '))}" x="${x}" y="${y}" width="${s}" height="${s}"/>` : '';
    return wood + `<g transform="skewX(-8) translate(14 0)">${sq}</g>` + pc('wk', 60, 42, 92) + pc('bq', 150, 50, 84) + pc('wn', 224, 74, 66); },
  checkers:() => { let sq = ''; for (let r = 0; r < 4; r++) for (let c = 0; c < 8; c++) sq += `<rect x="${c * 40}" y="${105 + r * 32}" width="40" height="32" fill="${(r + c) % 2 ? '#7a4f33' : '#ecd4ad'}"/>`;
    return wood + sq + disc(120, 150, 26, '#d23a43', '#7a1d24') + disc(120, 132, 26, '#d23a43', '#7a1d24') + disc(200, 120, 26, '#3a3134', '#141012') + disc(70, 80, 24, '#3a3134', '#141012') + disc(250, 168, 24, '#d23a43', '#7a1d24') + `<path d="M108 120h24l-3-12-5 5-4-8-4 8-5-5z" fill="#f2c75c"/>`; },
  mancala:() => { let p = ''; for (let i = 0; i < 6; i++){ p += `<ellipse cx="${88 + i * 29}" cy="78" rx="12" ry="15" fill="#2a140a"/><ellipse cx="${88 + i * 29}" cy="122" rx="12" ry="15" fill="#2a140a"/>`; }
    const beads = [[88, 118, '#7fc3e8'], [92, 125, '#e3b75c'], [146, 74, '#e5484d'], [149, 82, '#9be29b'], [143, 80, '#c79bff'], [204, 120, '#e3b75c'], [262, 96, '#7fc3e8'], [258, 106, '#e5484d'], [266, 110, '#9be29b'], [262, 116, '#e3b75c'], [46, 92, '#c79bff'], [50, 104, '#f6ecef']];
    return wood + `<rect x="22" y="44" width="276" height="112" rx="56" fill="url(#wd)" stroke="rgba(227,183,92,.5)" stroke-width="3"/><rect x="34" y="62" width="30" height="76" rx="15" fill="#2a140a"/><rect x="256" y="62" width="30" height="76" rx="15" fill="#2a140a"/>` + p + beads.map(([x, y, c]) => `<circle cx="${x}" cy="${y}" r="5" fill="${c}"/><circle cx="${x - 1.5}" cy="${y - 1.5}" r="1.6" fill="#fff" opacity=".7"/>`).join(''); },
  reversi:() => { let g = ''; for (let i = 0; i <= 8; i++){ g += `<line x1="${40 + i * 30}" y1="0" x2="${40 + i * 30}" y2="200" stroke="rgba(0,0,0,.35)"/>`; }
    for (let i = 0; i <= 7; i++) g += `<line x1="0" y1="${i * 30 + 10}" x2="320" y2="${i * 30 + 10}" stroke="rgba(0,0,0,.35)"/>`;
    const d = (x, y, w) => `<circle cx="${x}" cy="${y + 2}" r="12" fill="rgba(0,0,0,.35)"/><circle cx="${x}" cy="${y}" r="12" fill="${w ? '#f2efe8' : '#151515'}"/>`;
    return `<rect width="320" height="200" fill="#16603f"/>` + g + d(145, 85, 0) + d(175, 85, 1) + d(145, 115, 1) + d(175, 115, 0) + d(205, 115, 0) + d(205, 145, 1) + d(115, 55, 1) + `<g transform="translate(232 40) rotate(-20)"><ellipse rx="16" ry="5" fill="#f2efe8"/><ellipse cy="-3" rx="16" ry="5" fill="#151515"/></g>`; },
  wild:() => { const cols = ['#e5484d', '#e3b75c', '#3fae6a', '#3d7fe0']; let c = '';
    cols.forEach((col, i) => { c += `<g transform="translate(${160 + (i - 1.5) * 34} 168) rotate(${(i - 1.5) * 13})"><rect x="-34" y="-130" width="68" height="100" rx="9" fill="#fff"/><rect x="-29" y="-125" width="58" height="90" rx="6" fill="${col}"/><ellipse cx="0" cy="-80" rx="20" ry="30" fill="#fff" transform="rotate(25 0 -80)"/><text x="0" y="-70" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="700" font-size="30" fill="${col}">${['7', '+2', '★', '3'][i]}</text></g>`; });
    return wood + c; },
  dice:() => { const pip = (x, y) => `<circle cx="${x}" cy="${y}" r="4.2" fill="#2a1620"/>`;
    const die = (x, y, a, n) => { const P = {1:[[0,0]], 2:[[-9,-9],[9,9]], 3:[[-9,-9],[0,0],[9,9]], 4:[[-9,-9],[9,-9],[-9,9],[9,9]], 5:[[-9,-9],[9,-9],[0,0],[-9,9],[9,9]], 6:[[-9,-10],[9,-10],[-9,0],[9,0],[-9,10],[9,10]]}[n];
      return `<g transform="translate(${x} ${y}) rotate(${a})"><rect x="-21" y="-19" width="42" height="42" rx="9" fill="rgba(0,0,0,.35)"/><rect x="-21" y="-21" width="42" height="42" rx="9" fill="#fbf6ee"/>${P.map(([px, py]) => pip(px, py)).join('')}</g>`; };
    return wood + die(70, 110, -12, 5) + die(122, 82, 8, 5) + die(172, 120, -4, 5) + die(222, 86, 15, 5) + die(262, 128, -9, 5) + `<text x="160" y="185" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="700" font-size="20" fill="#e3b75c">Five of a kind!</text>`; },
  words:() => { const t = (x, y, ch, n, a) => `<g transform="translate(${x} ${y}) rotate(${a})"><rect x="-23" y="-21" width="46" height="46" rx="6" fill="rgba(0,0,0,.35)"/><rect x="-23" y="-23" width="46" height="46" rx="6" fill="#f3dfb8"/><text x="0" y="9" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="700" font-size="28" fill="#3a2416">${ch}</text><text x="15" y="18" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="800" font-size="10" fill="#3a2416">${n}</text></g>`;
    let g = ''; for (let i = 0; i < 9; i++) for (let j = 0; j < 5; j++) g += `<rect x="${i * 36 + 2}" y="${j * 40 + 2}" width="34" height="38" rx="3" fill="${(i + j) % 7 === 0 ? '#8b3a4f' : (i * j) % 5 === 1 ? '#2f5e7a' : '#5a3542'}" opacity=".55"/>`;
    return wood + g + t(80, 100, 'P', 3, -4) + t(130, 96, 'L', 1, 3) + t(180, 102, 'A', 1, -2) + t(230, 98, 'Y', 4, 5); }
};
const GAMES = [
  {id:'chess', name:'Chess', d:'The full game, with a Stockfish computer from Beginner to Grandmaster, clocks and move hints.', tags:['2 players', 'Computer', 'Online'], key:'chesshall.game'},
  {id:'checkers', name:'Checkers', d:'Jump, double-jump and get crowned. Jumps required or optional.', tags:['2 players', 'Computer', 'Online']},
  {id:'mancala', name:'Mancala', d:'Sow seeds around the board, steal from empty pits, earn free turns.', tags:['2 players', 'Computer', 'Online']},
  {id:'reversi', name:'Reversi', d:'Trap discs between yours and flip them. Corners are gold.', tags:['2 players', 'Computer', 'Online']},
  {id:'wildcards', name:'Wild Cards', art:'wild', d:'Match colours and numbers, skip, reverse and draw. Includes No Mercy rules.', tags:['2–4 players', 'Computer', 'Online']},
  {id:'fivedice', name:'Five Dice', art:'dice', d:'Roll five dice three times and fill your score card. Chase five of a kind.', tags:['1–4 players', 'Computer', 'Online']},
  {id:'wordtiles', name:'Word Tiles', art:'words', d:'Build words across the board from your letter rack. Bonus squares double and triple.', tags:['2–4 players', 'Computer', 'Online']}
];
function inProgress(g){
  if (g.id === 'chess'){ const s = get('chesshall.game', null); return s && Array.isArray(s.moves) && s.moves.length && !s.over; }
  const s = get('gamehall.save.' + g.id, null); return s && s.T && s.T.phase === 'play' && s.T.log && s.T.log.length > 1;
}
function shelf(){
  $('#shelf').innerHTML = GAMES.map(g => {
    const tag = g.soon ? 'div' : 'a', href = g.soon ? '' : `href="${g.id}/"`;
    const badge = g.soon ? '<span class="badge2">Coming soon</span>' : inProgress(g) ? '<span class="badge2">Continue</span>' : '';
    return `<${tag} class="box ${g.soon ? 'soon' : ''}" ${href}><span class="lid"><svg viewBox="0 0 320 200" role="img" aria-label="${esc(g.name)}">${ART[g.art || g.id]()}</svg></span>${badge}<div class="bx"><h2>${esc(g.name)}</h2><p>${esc(g.d)}</p><div class="tags">${g.tags.map(t => `<span>${t}</span>`).join('')}</div></div></${tag}>`;
  }).join('');
}
function $(s){ return document.querySelector(s); }
let tt = 0; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 3000); }
const prefs = get('gamehall.prefs', {});
if (!prefs.name){ const c = get('chesshall.prefs', {}); if (c.name) prefs.name = c.name; }
$('#nm').value = prefs.name || '';
$('#nm').oninput = e => { const p = get('gamehall.prefs', {}); p.name = e.target.value.slice(0, 24); set('gamehall.prefs', p); const c = get('chesshall.prefs', {}); c.name = p.name; set('chesshall.prefs', c); };
$('#jf').onsubmit = e => {
  e.preventDefault();
  const code = $('#jc').value.toLowerCase().replace(/[^a-z0-9]/g, '');
  if (code.length < 4){ toast('That code looks too short'); return; }
  const ix = get('gamehall.tables', {});
  if (ix[code]){ location.href = ix[code].game + '/#g-' + code; return; }
  if (get('chesshall.hosted', {})[code]){ location.href = 'chess/#g-' + code; return; }
  if (typeof Peer !== 'function'){ location.href = 'chess/#g-' + code; return; }
  toast('Looking for that game…');
  const opts = {debug:0};
  const bk = /^([a-z0-9.-]+):(\d{2,5})$/i.exec(new URLSearchParams(location.search).get('broker') || '');
  if (bk) Object.assign(opts, {host:bk[1], port:+bk[2], path:'/', secure:location.protocol === 'https:' && bk[1] !== 'localhost'});
  const q = location.search;
  const peer = new Peer(opts); let done = false;
  const go = id => { if (done) return; done = true; try{ peer.destroy(); }catch(x){} location.href = id + '/' + q + '#g-' + code; };
  peer.on('open', () => {
    const c = peer.connect('gamehall-v1-' + code, {reliable:true});
    c.on('open', () => c.send({t:'which'}));
    c.on('data', m => { if (m && m.t === 'game' && /^[a-z]+$/.test(m.id)) go(m.id); });
  });
  peer.on('error', err => { if (err.type === 'peer-unavailable') go('chess'); });
  setTimeout(() => { if (!done){ done = true; try{ peer.destroy(); }catch(x){} toast('Couldn’t find that game. Is the other player’s game open?'); } }, 10000);
};
const sc = document.createElement('script'); sc.src = 'chess/lib/pieces.js'; sc.onload = shelf; sc.onerror = shelf; document.body.appendChild(sc);
shelf();
}
</script>
</body>
</html>
